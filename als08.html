<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALŞ08 · P2P Transfer</title>
<link rel="manifest" href="manifest.json">

<!-- PeerJS (WebRTC) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- jsQR (QR okuma) -->
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<!-- qrcodejs (QR üretme — global QRCode yapıcısı) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{--bg:#0b1220;--card:#111c33;--ink:#e6edf7;--muted:#8ba0bf;--acc:#3b82f6;--ok:#10b981}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;
         background:#0d1730;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:10}
  header a{color:var(--ink);text-decoration:none;font-size:1.1rem;background:#1e293b;
           border-radius:10px;padding:8px 12px}
  header h1{font-size:1rem;margin:0;font-weight:600}
  main{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px;max-width:760px;
       width:100%;margin:0 auto}
  .card{background:var(--card);border:1px solid #1e293b;border-radius:14px;padding:16px}
  button{cursor:pointer;border:none;border-radius:10px;padding:12px 16px;
         font-size:.95rem;background:var(--acc);color:white;font-weight:600}
  button.secondary{background:#334155}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=text],input[type=file]{width:100%;padding:10px;border-radius:8px;
       border:1px solid #334155;background:#0f1a2e;color:var(--ink)}
  #qrBox{display:flex;justify-content:center;align-items:center;
         background:#fff;padding:10px;border-radius:12px;min-height:240px}
  #qrBox img,#qrBox canvas{display:block;width:220px;height:220px}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--muted);
       max-height:160px;overflow:auto;white-space:pre-wrap}
  #chat{display:flex;flex-direction:column;gap:8px;min-height:180px;max-height:40vh;
        overflow:auto;padding:6px}
  .msg{padding:8px 10px;border-radius:10px;max-width:80%;font-size:.9rem;word-break:break-word}
  .me{align-self:flex-end;background:#1d4ed8}
  .peer{align-self:flex-start;background:#334155}
  .msg img,.msg video{max-width:220px;border-radius:8px;display:block;margin-top:6px}
  .progress{height:8px;background:#1e293b;border-radius:6px;overflow:hidden;margin-top:6px}
  .progress > div{height:100%;width:0;background:var(--ok);transition:width .15s}
  #video{display:none;width:100%;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<header>
  <a href="./index.html" title="Ana ekran">←</a>
  <h1>ALŞ08 · P2P Transfer</h1>
</header>

<main>

  <!-- Rol seçimi -->
  <section class="card" id="roleCard">
    <p style="margin:0 0 12px;color:var(--muted)">Bu cihaz hangi rolü üstlenecek?</p>
    <div class="grid2">
      <button id="btnDesktop">💻 Bilgisayar (Web)</button>
      <button id="btnMobile" class="secondary">📱 Telefon (Mobil)</button>
    </div>
  </section>

  <!-- Bilgisayar modu: QR göster -->
  <section class="card" id="desktopCard" hidden>
    <p style="margin:0 0 10px;color:var(--muted)">Telefonundan bu QR kodu okut:</p>
    <div id="qrBox"></div>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin:10px 0 0">
      ID: <b id="desktopId">…</b>
    </p>
  </section>

  <!-- Mobil modu: QR oku -->
  <section class="card" id="mobileCard" hidden>
    <p style="margin:0 0 10px;color:var(--muted)">Bilgisayardaki QR kodu okut:</p>
    <button id="btnScan">📷 Kamerayı Aç ve QR Okut</button>
    <video id="video" playsinline></video>
    <p id="mobileHint" style="color:var(--muted);font-size:.85rem"></p>
  </section>

  <!-- Aktarım paneli -->
  <section class="card" id="transferCard" hidden>
    <div id="chat"></div>

    <div class="row" style="margin-top:10px">
      <input type="text" id="msgInput" placeholder="Mesaj yaz…" autocomplete="off">
      <button id="btnSendMsg">Gönder</button>
    </div>

    <div class="row" style="margin-top:10px">
      <label style="flex:1;display:inline-flex;align-items:center;justify-content:center;
             background:#334155;border-radius:10px;padding:12px;cursor:pointer;color:#fff">
        📎 Dosya Seç
        <input type="file" id="fileInput" hidden>
      </label>
    </div>
    <div id="progressWrap" style="display:none;margin-top:12px">
      <small id="progressLabel">Aktarım…</small>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </section>

  <!-- ALŞ09'dan gelen dosya için "bilgisayara aktar" paneli -->
  <section class="card" id="handoffCard" hidden>
    <p style="margin:0 0 8px;color:var(--muted)">
      ALŞ09 üzerinden bir dosya alındı. Şimdi bunu bilgisayarına aktarmak ister misin?
    </p>
    <div class="row">
      <button id="btnHandoff">🖥️ Bilgisayarıma Aktar</button>
      <button class="secondary" id="btnHandoffCancel">Vazgeç</button>
    </div>
  </section>

  <section class="card">
    <small style="color:var(--muted)">Günlük</small>
    <div id="log"></div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var $ = function (sel) { return document.querySelector(sel); };
  var CHUNK = 16 * 1024;

  /* ---------- ICE YAPILANDIRMASI (STUN + TURN) ---------- */
  var ICE_CONFIG = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    }
  };

  // Peer oluştururken her yerde kullanacağımız ortak seçenek
  function peerOptions() {
    return Object.assign({ debug: 1 }, ICE_CONFIG);
  }

  function log() {
    var el = $('#log');
    if (!el) return;
    var args = Array.prototype.slice.call(arguments);
    el.textContent += args.join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
  }

  /* ---------- QR ÇİZİMİ (qrcodejs ile) ---------- */
  function drawQR(container, text) {
    if (!container) return;
    container.innerHTML = '';

    if (typeof QRCode === 'undefined') {
      var fb = document.createElement('div');
      fb.style.color = '#000';
      fb.style.fontSize = '11px';
      fb.style.fontFamily = 'monospace';
      fb.style.wordBreak = 'break-all';
      fb.style.padding = '8px';
      fb.textContent = text;
      container.appendChild(fb);
      log('⚠️ QR kütüphanesi yüklenmedi, metin gösteriliyor');
      return;
    }

    try {
      new QRCode(container, {
        text: text,
        width: 220,
        height: 220,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      log('✅ QR kod üretildi');
    } catch (e) {
      console.error('QR oluşturma hatası:', e);
      log('❌ QR hatası:', e.message);
    }
  }

  /* ---------- ALŞ10 köprüsü ---------- */
  var handoffMeta = sessionStorage.getItem('als10_handoff_meta');
  if (handoffMeta) {
    $('#handoffCard').hidden = false;
  }
  $('#btnHandoffCancel').onclick = function () {
    sessionStorage.removeItem('als10_handoff_meta');
    $('#handoffCard').hidden = true;
  };
  $('#btnHandoff').onclick = function () {
    sessionStorage.removeItem('als10_handoff_meta');
    $('#handoffCard').hidden = true;
    startDesktop();
  };

  /* ---------- Rol seçimi ---------- */
  $('#btnDesktop').onclick = function () { startDesktop(); };
  $('#btnMobile').onclick = function () { startMobile(); };

  /* ---------- BİLGİSAYAR MODU ---------- */
  var peer = null;
  var conn = null;
  var role = null;
  var receiving = null;

  function startDesktop() {
    role = 'desktop';
    $('#roleCard').hidden = true;
    $('#desktopCard').hidden = false;
    $('#mobileCard').hidden = true;

    peer = new Peer(undefined, peerOptions());

    peer.on('open', function (id) {
      $('#desktopId').textContent = id;
      var url = location.origin + location.pathname + '#offer=' + encodeURIComponent(id);
      log('🟢 Peer hazır. ID:', id);
      drawQR($('#qrBox'), url);
    });

    peer.on('connection', function (c) {
      conn = c;
      log('📥 Bağlantı alındı:', c.peer);
      bindConn();
    });

    peer.on('error', function (e) {
      log('❌ Peer hata:', e.type, e.message);
    });
  }

  /* ---------- MOBİL MODU ---------- */
  function startMobile() {
    role = 'mobile';
    $('#roleCard').hidden = true;
    $('#mobileCard').hidden = false;
    $('#desktopCard').hidden = true;
    $('#btnScan').onclick = function () { openScanner(); };
  }

  function openScanner() {
    var video = $('#video');
    video.style.display = 'block';
    $('#mobileHint').textContent = 'Kamera açılıyor…';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (stream) {
        video.srcObject = stream;
        video.play();

        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d', { willReadFrequently: true });

        function tick() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var code = window.jsQR(img.data, img.width, img.height);
            if (code && code.data) {
              stream.getTracks().forEach(function (t) { t.stop(); });
              video.style.display = 'none';
              $('#mobileHint').textContent = 'QR okundu ✔';
              connectTo(code.data);
              return;
            }
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })
      .catch(function (err) {
        $('#mobileHint').textContent = 'Kamera hatası: ' + err.message;
      });
  }

  function connectTo(qrText) {
    var id = qrText;
    var m = qrText.match(/#offer=([^&]+)/);
    if (m) id = decodeURIComponent(m[1]);

    peer = new Peer(undefined, peerOptions());
    peer.on('open', function () {
      log('🟢 Peer hazır. Bağlanılıyor:', id);
      conn = peer.connect(id, { reliable: true });
      bindConn();
    });
    peer.on('error', function (e) {
      log('❌', e.type, e.message);
    });
  }

  /* ---------- ORTAK BAĞLANTI ---------- */
  function bindConn() {
    conn.on('open', function () {
      log('✅ P2P bağlantı kuruldu');
      $('#transferCard').hidden = false;
      $('#desktopCard').hidden = true;
      $('#mobileCard').hidden = true;
    });

    conn.on('data', function (d) {
      if (typeof d === 'string') {
        addMsg(d, 'peer');
        return;
      }
      handleIncoming(d);
    });

    conn.on('close', function () { log('🔌 Bağlantı kapandı'); });
    conn.on('error', function (e) { log('❌ Conn:', e); });
  }

  function handleIncoming(d) {
    if (d.type === 'text') {
      addMsg(d.text, 'peer');
    } else if (d.type === 'file-meta') {
      receiving = { name: d.name, size: d.size, mime: d.mime, chunks: [], received: 0 };
      showProgress('Alınıyor: ' + d.name);
    } else if (d.type === 'file-chunk') {
      if (!receiving) return;
      receiving.chunks.push(d.chunk);
      receiving.received += d.chunk.byteLength;
      updateProgress(receiving.received / receiving.size);
    } else if (d.type === 'file-end') {
      if (!receiving) return;
      var blob = new Blob(receiving.chunks, { type: receiving.mime });
      var url = URL.createObjectURL(blob);
      addFileBubble(receiving.name, receiving.mime, url);
      hideProgress();
      receiving = null;
    }
  }

  /* ---------- MESAJ ---------- */
  $('#btnSendMsg').onclick = function () {
    var t = $('#msgInput').value.trim();
    if (!t || !conn || !conn.open) return;
    conn.send({ type: 'text', text: t });
    addMsg(t, 'me');
    $('#msgInput').value = '';
  };
  $('#msgInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('#btnSendMsg').click();
  });

  function addMsg(text, who) {
    var el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    $('#chat').appendChild(el);
    $('#chat').scrollTop = $('#chat').scrollHeight;
  }

  function addFileBubble(name, mime, url) {
    var el = document.createElement('div');
    el.className = 'msg peer';
    if (mime && mime.indexOf('image/') === 0) {
      el.innerHTML = '<div>' + name + '</div><img src="' + url + '" alt="">';
    } else if (mime && mime.indexOf('video/') === 0) {
      el.innerHTML = '<div>' + name + '</div><video controls src="' + url + '"></video>';
    } else {
      el.innerHTML = '<div>' + name + '</div><a href="' + url + '" download="' + name +
                     '" style="color:#93c5fd">⬇ İndir</a>';
    }
    $('#chat').appendChild(el);
    $('#chat').scrollTop = $('#chat').scrollHeight;
  }

  /* ---------- DOSYA GÖNDERİMİ ---------- */
  $('#fileInput').onchange = function (e) {
    var file = e.target.files[0];
    if (!file || !conn || !conn.open) return;

    conn.send({ type: 'file-meta', name: file.name, size: file.size, mime: file.type });
    showProgress('Gönderiliyor: ' + file.name);

    var offset = 0;
    var reader = new FileReader();

    function readSlice() {
      reader.readAsArrayBuffer(file.slice(offset, offset + CHUNK));
    }

    reader.onload = function (ev) {
      var chunk = ev.target.result;
      conn.send({ type: 'file-chunk', chunk: chunk });
      offset += chunk.byteLength;
      updateProgress(offset / file.size);

      if (offset < file.size) {
        if (conn.dataChannel && conn.dataChannel.bufferedAmount > 8 * CHUNK) {
          setTimeout(readSlice, 30);
        } else {
          readSlice();
        }
      } else {
        conn.send({ type: 'file-end' });
        hideProgress();
        var url = URL.createObjectURL(file);
        addFileBubble(file.name, file.type, url);
      }
    };

    readSlice();
  };

  /* ---------- İLERLEME ---------- */
  function showProgress(label) {
    $('#progressWrap').style.display = 'block';
    $('#progressLabel').textContent = label;
    $('#progressBar').style.width = '0%';
  }
  function updateProgress(ratio) {
    $('#progressBar').style.width = Math.min(100, Math.round(ratio * 100)) + '%';
  }
  function hideProgress() {
    setTimeout(function () { $('#progressWrap').style.display = 'none'; }, 400);
  }

  /* ---------- URL HASH ile otomatik bağlan ---------- */
  if (location.hash.indexOf('#offer=') === 0) {
    var oid = decodeURIComponent(location.hash.slice(7));
    startMobile();
    peer = new Peer(undefined, peerOptions());
    peer.on('open', function () {
      conn = peer.connect(oid, { reliable: true });
      bindConn();
    });
  }

})();
</script>
</body>
</html>
